name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Project Files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip || true
            rm *.zip || true
          fi
          PKG_PATH=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            exit 1
          fi
          PKG_DIR=$(dirname "$PKG_PATH")
          if [ "$PKG_DIR" != "." ]; then
            mv "$PKG_DIR"/* . || true
            mv "$PKG_DIR"/.[!.]* . || true
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Capacitor Setup
        run: |
          PROJECT_ROOT=$(pwd)
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # 1. Update Info.plist for NFC tracking
          PLIST="$PROJECT_ROOT/ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NFCReaderUsageDescription string 'TracePro requires NFC access to scan RFID/NFC tags.'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats array" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats:0 string NDEF" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats:1 string TAG" "$PLIST" || true
          fi

          # 2. Create Entitlements file
          ENTITLEMENTS="$PROJECT_ROOT/ios/App/App/App.entitlements"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>com.apple.developer.nfc.readersession.formats</key>\n\t<array>\n\t\t<string>NDEF</string>\n\t\t<string>TAG</string>\n\t\t</array>\n</dict>\n</plist>' > "$ENTITLEMENTS"

          # 3. Patch Podfile to raise deployment target and disable bitcode
          # We rewrite it from scratch to ensure a clean state
          PODFILE="$PROJECT_ROOT/ios/App/Podfile"
          HELPERS_PATH="$PROJECT_ROOT/node_modules/@capacitor/ios/scripts/pods_helpers.rb"
          
          printf "require '$HELPERS_PATH'\n\nplatform :ios, '14.0'\nuse_frameworks!\n\ntarget 'App' do\n  capacitor_pods\nend\n\npost_install do |installer|\n  assert_deployment_target!(installer)\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'\n      config.build_settings['ENABLE_BITCODE'] = 'NO'\n    end\n  end\nend\n" > "$PODFILE"

          # 4. Install Pods
          cd ios/App && pod install --repo-update && cd ../..

      - name: Build Xcode Project
        run: |
          # We use Debug configuration and disable signing to allow the build to complete in CI
          xcodebuild archive \
                     -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     IPHONEOS_DEPLOYMENT_TARGET=14.0 \
                     GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
                     -quiet

      - name: Export IPA
        run: |
          # Since we can't sign, we manually package the .app into a Payload folder
          mkdir -p build/Payload
          APP_PATH=$(find App.xcarchive -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in archive"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload
          cd build && zip -r TracePro.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TracePro-iOS-IPA
          path: build/TracePro.ipa
