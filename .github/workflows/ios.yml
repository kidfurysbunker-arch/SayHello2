name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Project Files
        run: |
          # 1. Unzip if needed
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Unzipping uploaded project..."
            unzip -o *.zip || true
            rm *.zip || true
          fi
          
          # 2. Find project root
          PKG_PATH=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: No package.json found."
            ls -R
            exit 1
          fi
          
          PKG_DIR=$(dirname "$PKG_PATH")
          echo "Project detected in: $PKG_DIR"
          
          # 3. Move to root if nested
          if [ "$PKG_DIR" != "." ]; then
            echo "Relocating files to root..."
            mv "$PKG_DIR"/* . || true
            mv "$PKG_DIR"/.[!.]* . || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Setup
        run: |
          # 1. Clean up and re-add
          rm -rf ios
          echo "Adding fresh iOS platform..."
          npx cap add ios
          
          # 2. Sync (Verbose)
          echo "Syncing web assets to native..."
          npx cap sync ios --verbose
          
          # 3. Check if build succeeded
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "SUCCESS: ios/App/App.xcworkspace exists."
          else
            echo "ERROR: ios/App/App.xcworkspace was not created."
            ls -R ios || echo "ios folder is missing"
            exit 1
          fi

      - name: Build Xcode Project
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find App.xcarchive -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in archive!"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload
          cd build && zip -r TracePro.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TracePro-iOS-IPA
          path: build/TracePro.ipa
